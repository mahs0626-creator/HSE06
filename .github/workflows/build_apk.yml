name: HSE05 - Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android platform files
        run: flutter create --platforms=android --project-name hse_academy .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app source
        run: flutter analyze lib --no-pub --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSE05-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
